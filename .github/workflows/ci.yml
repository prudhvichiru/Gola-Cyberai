name: Gola CyberAI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. SECURITY AUDIT & DEPENDENCY SCANNING
  # ==========================================
  security-audit:
    name: Security & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run Backend npm audit
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: Run Frontend npm audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  # ==========================================
  # 2. BACKEND LINT, BUILD & INTEGRATION
  # ==========================================
  backend-test:
    name: Backend Build & Typecheck
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

  # ==========================================
  # 3. FRONTEND LINT, TYPECHECK & UNIT TESTS
  # ==========================================
  frontend-test:
    name: Frontend Tests, Typecheck & Security Audit
    runs-on: ubuntu-latest
    needs: security-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Run All Automated Unit & Security Test Suites (34 Tests)
        run: |
          cd frontend
          npm test

  # ==========================================
  # 4. DOCKER BUILD SMOKE TEST
  # ==========================================
  docker-build:
    name: Docker Containerization Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t gola-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t gola-frontend:latest ./frontend
